[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vlbtix-image-pipeline"
version = "0.1.0"
description = "Collect authorized book images, prepare manual ChatGPT batches, import findings, build an image taxonomy."
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1", "Pillow>=10.4", "openpyxl>=3.1"]

[project.optional-dependencies]
vlbtix = ["playwright>=1.45"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
